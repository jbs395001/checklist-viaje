<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Checklist Viaje C&amp;J</title>
<meta name="description" content="Checklist del viaje de novios. Funciona sin conexión.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#8c2f22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Viaje C&amp;J">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#f6f3ee; --card:#fff; --ink:#1f1d1a; --muted:#6c675f; --line:#e4ddd1;
  --acc:#8c2f22; --acc-ink:#fff; --acc-soft:#f7e9e6; --teal:#0f5257;
  --crit:#b3261e; --crit-soft:#fdecea; --alta:#9a5b00; --alta-soft:#fdf3e1; --media:#4b5563; --media-soft:#eef0f2;
  --ok:#2e7d32; --ok-soft:#e8f3e8; --warn:#b26a00; --warn-soft:#fff4dd; --bad:#b3261e;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.05);
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#151413; --card:#211f1d; --ink:#f1ede7; --muted:#a8a197; --line:#36322e;
    --acc:#d0614f; --acc-ink:#1a0f0d; --acc-soft:#3a2420; --teal:#6fb7bb;
    --crit:#ff6b5e; --crit-soft:#3d1f1c; --alta:#f0b25a; --alta-soft:#3a2d17; --media:#b8c0cc; --media-soft:#2b2f35;
    --ok:#7cc684; --ok-soft:#1f2f21; --warn:#f0b25a; --warn-soft:#3a2d17; --bad:#ff6b5e;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));}
a{color:var(--teal);text-decoration:underline;text-underline-offset:2px;word-break:break-word}
button{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 12px}
.hidden{display:none!important}

/* ---------- lock ---------- */
#lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.lockbox{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:28px 22px;max-width:380px;width:100%;text-align:center}
.lockbox h1{font-size:22px;margin:8px 0 4px}
.lockbox p{color:var(--muted);margin:0 0 18px;font-size:14px}
.lockbox input{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:17px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600;font-size:15px}
.btn.primary{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.block{width:100%;margin-top:12px}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:8px}

/* ---------- header ---------- */
header.top{position:sticky;top:0;z-index:20;background:var(--bg);padding-top:env(safe-area-inset-top);border-bottom:1px solid var(--line)}
.titlebar{display:flex;align-items:center;gap:10px;padding:10px 0 6px}
.titlebar h1{font-size:18px;margin:0;flex:1;line-height:1.2}
.titlebar h1 small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.net{font-size:12px;padding:3px 8px;border-radius:99px;background:var(--ok-soft);color:var(--ok);white-space:nowrap}
.net.off{background:var(--warn-soft);color:var(--warn)}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.stats{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);padding:6px 0 8px}
.stats b{color:var(--ink)}
.toolbar{display:flex;gap:8px;padding:0 0 8px;align-items:center}
.search{flex:1;min-width:0;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:15px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:14px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.chip .n{opacity:.75;font-size:12px;margin-left:4px}

/* ---------- upcoming ---------- */
.upcoming{margin:12px 0 4px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:10px 12px}
.upcoming h2{font-size:13px;margin:0 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.up-row{display:flex;gap:8px;align-items:baseline;padding:6px 0;border-top:1px solid var(--line);font-size:14px;cursor:pointer}
.up-row:first-of-type{border-top:none}
.up-row .when{flex:none;font-weight:700;font-variant-numeric:tabular-nums;min-width:74px}
.up-row .what{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- categories ---------- */
.cat{margin-top:18px}
.cathead{display:flex;align-items:center;gap:8px;margin:0 2px 8px;font-size:16px}
.cathead h2{font-size:16px;margin:0;flex:1}
.cathead .count{font-size:13px;color:var(--muted)}
.colhead{display:none}

/* ---------- task (mobile: card) ---------- */
.task{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin:0 0 10px;border-left:5px solid transparent;overflow:hidden}
.task.crit{border-left-color:var(--crit)}
.task.done{opacity:.62}
.task.done .action{text-decoration:line-through;text-decoration-thickness:1px}
.trow{display:grid;grid-template-columns:52px 1fr;align-items:start}
.cb{width:52px;min-height:56px;display:flex;align-items:flex-start;justify-content:center;padding-top:14px;cursor:pointer;background:none;border:none}
.cb span{width:26px;height:26px;border-radius:8px;border:2px solid var(--muted);display:flex;align-items:center;justify-content:center;font-size:17px;line-height:1;color:#fff}
.task.done .cb span{background:var(--ok);border-color:var(--ok)}
.main{padding:10px 12px 10px 0;cursor:pointer;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:4px}
.prio{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.prio.crit{background:var(--crit-soft);color:var(--crit)}
.prio.alta{background:var(--alta-soft);color:var(--alta)}
.prio.media{background:var(--media-soft);color:var(--media)}
.mine{font-size:11px;padding:2px 7px;border-radius:99px;background:var(--acc-soft);color:var(--acc);font-weight:700}
.action{font-weight:600;font-size:15.5px;line-height:1.35}
.dates{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.dl{font-weight:600}
.dl.overdue{color:var(--bad)}
.dl.soon{color:var(--warn)}
.dl.okd{color:var(--ok)}
.chev{font-size:12px;color:var(--muted);margin-top:4px}
.details{padding:0 12px 12px 12px;border-top:1px solid var(--line);display:none}
.task.open .details{display:block}
.lbl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:12px 0 4px}
.doc{font-size:14.5px;line-height:1.5}
textarea.notes{width:100%;min-height:76px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:10px;font:inherit;font-size:15px;resize:vertical}
.edited{font-size:12px;color:var(--muted);margin-top:4px;min-height:16px}
.dateedit{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dateedit label{font-size:12px;color:var(--muted);display:block}
.dateedit input{width:100%;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:15px;min-height:42px}
.rowbtns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn.small{min-height:36px;padding:6px 12px;font-size:13px}
.btn.danger{color:var(--bad)}

/* ---------- desktop: table ---------- */
@media (min-width: 900px){
  body{padding-bottom:40px}
  .colhead{display:grid;grid-template-columns:44px 100px minmax(170px,1.1fr) minmax(230px,1.6fr) minmax(190px,1.1fr) 150px 150px;gap:0;
    font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:0 0 6px}
  .colhead>div{padding:0 8px}
  .task{display:grid;grid-template-columns:44px 100px minmax(170px,1.1fr) minmax(230px,1.6fr) minmax(190px,1.1fr) 150px 150px;border-radius:10px;margin-bottom:6px;align-items:start}
  .task .trow,.task .main,.task .details,.task.open .details{display:contents}
  .task .cb{width:44px;padding-top:12px;grid-column:1}
  .task .meta{grid-column:2;padding:12px 8px;margin:0}
  .task .action{grid-column:3;padding:12px 8px}
  .task .dates,.task .chev{display:none}
  .task .details{border:none}
  .task .dcell{grid-column:4;padding:10px 8px;border-left:1px solid var(--line)}
  .task .ncell{grid-column:5;padding:10px 8px;border-left:1px solid var(--line)}
  .task .tcell{grid-column:6;padding:12px 8px;border-left:1px solid var(--line)}
  .task .lcell{grid-column:7;padding:12px 8px;border-left:1px solid var(--line)}
  .task .lbl{display:none}
  .task .doc{font-size:13.5px}
  .task textarea.notes{min-height:64px;font-size:14px}
  .task .dateedit{display:contents}
  .task .dateedit label{display:none}
  .task .dateedit input{font-size:13px;padding:6px;min-height:34px}
  .task .rel{display:block;font-size:12px;margin-top:4px}
  .task .rowbtns{grid-column:5;padding:0 8px 10px}
}
.rel{display:none}

/* ---------- bottom bar ---------- */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);
  display:flex;gap:6px;justify-content:space-around;padding:8px 8px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -2px 10px rgba(0,0,0,.06)}
.bb{flex:1;max-width:160px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;border:none;background:none;border-radius:12px;cursor:pointer;font-size:12px;color:var(--muted)}
.bb .ic{font-size:20px;line-height:1.1}
.bb:active{background:var(--bg)}
@media (min-width:900px){.bb{flex-direction:row;gap:8px;font-size:14px;min-height:44px;max-width:none;flex:none;padding:0 14px;border:1px solid var(--line);background:var(--card);color:var(--ink)}}

@media (min-width:900px){
  nav.bottombar{left:auto;right:20px;bottom:16px;border:none;background:transparent;box-shadow:none;padding:0;gap:8px;justify-content:flex-end}
  nav.bottombar .bb{box-shadow:var(--shadow)}
  body{padding-bottom:90px}
  .task .tcell input,.task .lcell input{width:100%}
  .task .tcell::before,.task .lcell::before{content:attr(data-d);display:block;font-weight:600;font-size:13px;margin-bottom:4px}
}
/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
@media (min-width:600px){.modal{align-items:center}.sheet{border-radius:20px}}
.sheet h3{margin:0 0 6px;font-size:18px}
.sheet p{margin:6px 0;color:var(--muted);font-size:14px}
.sheet textarea,.sheet input,.sheet select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:15px;margin-top:6px}
.sheet textarea{min-height:110px}
.sheet .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sheet label{font-size:13px;color:var(--muted);display:block;margin-top:10px}
.sheet .acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.sheet .acts .btn{flex:1}
.menu-item{display:flex;width:100%;text-align:left;gap:12px;align-items:center;padding:14px 8px;border:none;border-bottom:1px solid var(--line);background:none;font-size:16px;cursor:pointer}
.menu-item small{display:block;color:var(--muted);font-size:13px}

.banner{margin:10px 0 0;padding:10px 12px;border-radius:12px;background:var(--acc-soft);font-size:14px;display:flex;gap:10px;align-items:flex-start}
.banner .x{margin-left:auto;border:none;background:none;font-size:18px;cursor:pointer;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:90vw;text-align:center}
footer{color:var(--muted);font-size:12px;text-align:center;padding:24px 0 8px}
.empty{color:var(--muted);text-align:center;padding:30px 10px}

@media print{
  header.top,.bottombar,.banner,.upcoming,.rowbtns,.toast,.modal{display:none!important}
  body{background:#fff;padding:0;color:#000}
  .task{box-shadow:none;border:1px solid #ccc;break-inside:avoid}
  .task .details{display:block!important}
  textarea.notes{border:none;min-height:0;height:auto;padding:0}
}
</style>
</head>

<div id="lock">

let KEY = null, DATA = null, STATE = null, ME = "";

/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ls = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); return true; } catch(e){ return false; } },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
function b64e(bytes){ let s=""; const b=new Uint8Array(bytes); for(let i=0;i<b.length;i+=0x8000){ s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000)); } return btoa(s); }
function b64d(str){ const s=atob(str); const b=new Uint8Array(s.length); for(let i=0;i<s.length;i++) b[i]=s.charCodeAt(i); return b; }
const b64ue = b => b64e(b).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
function b64ud(s){ s=s.replace(/-/g,"+").replace(/_/g,"/"); while(s.length%4) s+="="; return b64d(s); }
function toast(msg, ms){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), ms||2600); }

const DAYS=["dom","lun","mar","mié","jue","vie","sáb"], MON=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
function parseD(s){ if(!s) return null; const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function today(){ const n=new Date(); return new Date(n.getFullYear(),n.getMonth(),n.getDate()); }
function fmtD(s){ const d=parseD(s); return d ? `${DAYS[d.getDay()]} ${d.getDate()}-${MON[d.getMonth()]}` : "—"; }
function diffDays(s){ const d=parseD(s); return d ? Math.round((d-today())/86400000) : null; }
function relTxt(n){ if(n==null) return ""; if(n===0) return "hoy"; if(n===1) return "mañana"; if(n>1) return `quedan ${n} días`; if(n===-1) return "venció ayer"; return `vencida hace ${-n} días`; }
function fmtTs(t){ const d=new Date(t); return `${d.getDate()}-${MON[d.getMonth()]} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; }

/* ---------- crypto ---------- */
async function deriveKey(pass, salt){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:250000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, true, ["encrypt","decrypt"]);
}
async function decryptPayload(key){
  const raw = b64d(PAYLOAD); const iv = raw.slice(16,28), ct = raw.slice(28);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv}, key, ct);
  return JSON.parse(new TextDecoder().decode(pt));
}
async function encryptBytes(bytes){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM", iv}, KEY, bytes));
  const out = new Uint8Array(12+ct.length); out.set(iv,0); out.set(ct,12); return out;
}
async function decryptBytes(bytes){
  const iv = bytes.slice(0,12), ct = bytes.slice(12);
  return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM", iv}, KEY, ct));
}
async function deflate(bytes){
  if(typeof CompressionStream==="undefined") return {flag:0, bytes};
  const s = new Blob([bytes]).stream().pipeThrough(new CompressionStream("deflate-raw"));
  return {flag:1, bytes:new Uint8Array(await new Response(s).arrayBuffer())};
}
async function inflate(flag, bytes){
  if(flag===0) return bytes;
  const s = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return new Uint8Array(await new Response(s).arrayBuffer());
}

/* ---------- state ---------- */
function loadState(){
  let s=null; try { s=JSON.parse(ls.get(STATE_LS)||"null"); } catch(e){}
  if(!s || typeof s!=="object") s={};
  s.items=s.items||{}; s.custom=s.custom||{};
  return s;
}
function saveState(){ if(!ls.set(STATE_LS, JSON.stringify(STATE))) toast("⚠️ No se pudo guardar en este dispositivo"); }
function rec(id){ return STATE.items[id] || (STATE.items[id]={}); }
function setField(id, field, value){
  const r = rec(id); r[field] = {v:value, t:Date.now(), by:ME||"?"}; saveState();
}
function allTasks(){
  const base = DATA.tasks.map(t=>Object.assign({}, t, {custom:false}));
  const mine = Object.values(STATE.custom).filter(c=>!c.deleted).map(c=>Object.assign({doc:""}, c, {custom:true}));
  return base.concat(mine);
}
function view(t){
  const r = STATE.items[t.id] || {};
  return {
    done: r.done ? !!r.done.v : false,
    notes: r.notes ? r.notes.v : "",
    notesMeta: r.notes ? r.notes : null,
    doneMeta: r.done ? r.done : null,
    target: (r.target && r.target.v) || t.target || "",
    limit: (r.limit && r.limit.v) || t.limit || "",
  };
}
function mergeIn(inc){
  let n=0;
  for(const [id, fields] of Object.entries(inc.items||{})){
    const cur = rec(id);
    for(const [f, val] of Object.entries(fields||{})){
      if(!val || typeof val.t!=="number") continue;
      if(!cur[f] || val.t > cur[f].t){ cur[f]=val; n++; }
    }
  }
  for(const [id, c] of Object.entries(inc.custom||{})){
    const cur = STATE.custom[id];
    if(!cur || (c.t||0) > (cur.t||0)){ STATE.custom[id]=c; n++; }
  }
  saveState(); return n;
}

/* ---------- render ---------- */
const PRIO = {crit:{t:"🚨 Crítica", o:0}, alta:{t:"Alta", o:1}, media:{t:"Media", o:2}};
function dlClass(v, done){ if(done) return "okd"; const n=diffDays(v.limit); if(n==null) return ""; if(n<0) return "overdue"; if(n<=3) return "soon"; return ""; }
function matches(t, v){
  if(catFilter!=="all" && t.cat!==catFilter) return false;
  if(filter==="pend" && v.done) return false;
  if(filter==="crit" && (t.prio!=="crit" || v.done)) return false;
  if(filter==="week"){ if(v.done) return false; const n=Math.min(diffDays(v.limit)??999, diffDays(v.target)??999); if(n>7) return false; }
  if(filter==="over"){ if(v.done) return false; const n=diffDays(v.limit); if(n==null || n>=0) return false; }
  if(query){
    const h=(t.action+" "+(t.doc||"").replace(/<[^>]+>/g," ")+" "+v.notes).toLowerCase();
    if(!query.split(/\s+/).every(w=>h.includes(w))) return false;
  }
  return true;
}
function sortTasks(a,b){
  const va=view(a), vb=view(b);
  if(va.done!==vb.done) return va.done?1:-1;
  const la=va.limit||"9999", lb=vb.limit||"9999"; if(la!==lb) return la<lb?-1:1;
  const ta=va.target||"9999", tb=vb.target||"9999"; if(ta!==tb) return ta<tb?-1:1;
  return PRIO[a.prio].o-PRIO[b.prio].o;
}
function taskHTML(t){
  const v=view(t), dc=dlClass(v, v.done), open=openSet.has(t.id);
  const nm=v.notesMeta, dm=v.doneMeta;
  const editedTxt = nm ? `Editado por ${esc(nm.by)} · ${fmtTs(nm.t)}` : "";
  const doneTxt = v.done && dm ? `✓ Marcada por ${esc(dm.by)} · ${fmtTs(dm.t)}` : "";
  return `<article class="task ${t.prio==="crit"?"crit":""} ${v.done?"done":""} ${open?"open":""}" data-id="${esc(t.id)}">
    <div class="trow">
      <button class="cb" data-act="toggle" aria-label="${v.done?"Marcar como pendiente":"Marcar como completada"}" aria-pressed="${v.done}"><span>${v.done?"✓":""}</span></button>
      <div class="main" data-act="open">
        <div class="meta"><span class="prio ${t.prio}">${PRIO[t.prio].t}</span>${t.custom?'<span class="mine">Mía</span>':""}</div>
        <div class="action">${esc(t.action)}</div>
        <div class="dates"><span>🎯 ${fmtD(v.target)}</span><span class="dl ${dc}">⛔ ${fmtD(v.limit)}${v.done?"":" · "+relTxt(diffDays(v.limit))}</span></div>
        <div class="chev">${open?"▲ Ocultar":"▼ Detalles y mis comentarios"}</div>
      </div>
    </div>
    <div class="details">
      <div class="dcell"><div class="lbl">📄 Comentarios del documento</div><div class="doc">${t.doc||'<span style="color:var(--muted)">—</span>'}</div></div>
      <div class="ncell"><div class="lbl">✏️ Mis comentarios</div>
        <textarea class="notes" data-act="notes" placeholder="Escribe aquí tus notas…">${esc(v.notes)}</textarea>
        <div class="edited">${editedTxt}${editedTxt&&doneTxt?"<br>":""}${doneTxt}</div></div>
      <div class="dateedit">
        <div class="tcell" data-d="🎯 ${fmtD(v.target)}"><label>🎯 Fecha objetivo</label><input type="date" data-act="target" value="${esc(v.target)}"></div>
        <div class="lcell" data-d="⛔ ${fmtD(v.limit)}"><label>⛔ Fecha límite</label><input type="date" data-act="limit" value="${esc(v.limit)}"><span class="rel dl ${dc}">${v.done?"Hecha":relTxt(diffDays(v.limit))}</span></div>
      </div>
      ${t.custom?`<div class="rowbtns"><button class="btn small" data-act="edit">Editar tarea</button><button class="btn small danger" data-act="del">Eliminar</button></div>`:""}
    </div>
  </article>`;
}
function render(){
  const tasks=allTasks();
  const total=tasks.length, done=tasks.filter(t=>view(t).done).length;
  const critPend=tasks.filter(t=>t.prio==="crit"&&!view(t).done).length;
  const over=tasks.filter(t=>{const v=view(t); const n=diffDays(v.limit); return !v.done&&n!=null&&n<0;}).length;
  const week=tasks.filter(t=>{const v=view(t); if(v.done) return false; const n=Math.min(diffDays(v.limit)??999, diffDays(v.target)??999); return n<=7;}).length;
  $("#pbar").style.width = (total? Math.round(done*100/total):0)+"%";
  const dleft = diffDays("2026-11-30");
  $("#subtitle").textContent = dleft>0 ? `Salida en ${dleft} días · ${ME?("Hola, "+ME):""}` : (ME?("Hola, "+ME):"");
  $("#stats").innerHTML = `<span><b>${done}/${total}</b> completadas</span><span>🚨 <b>${critPend}</b> críticas pendientes</span>${over?`<span style="color:var(--bad)">⛔ <b>${over}</b> vencidas</span>`:""}`;

  const F=[["all","Todas",total],["pend","Pendientes",total-done],["crit","🚨 Críticas",critPend],["week","Próximos 7 días",week],["over","Vencidas",over]];
  $("#filters").innerHTML = F.map(([k,l,n])=>`<button class="chip" data-f="${k}" aria-pressed="${filter===k}">${l}<span class="n">${n}</span></button>`).join("");
  const C=[{id:"all",icon:"",name:"Todas las categorías"}].concat(DATA.cats);
  $("#cats").innerHTML = C.map(c=>{const n=c.id==="all"?total:tasks.filter(t=>t.cat===c.id).length; return `<button class="chip" data-c="${c.id}" aria-pressed="${catFilter===c.id}">${c.icon} ${esc(c.name)}<span class="n">${n}</span></button>`;}).join("");

  // upcoming
  const up = tasks.filter(t=>!view(t).done).sort(sortTasks).slice(0,4);
  $("#upcoming").innerHTML = up.length ? `<h2>Lo próximo</h2>` + up.map(t=>{const v=view(t); const dc=dlClass(v,false); return `<div class="up-row" data-jump="${esc(t.id)}"><span class="when dl ${dc}">${fmtD(v.limit)}</span><span class="what">${t.prio==="crit"?"🚨 ":""}${esc(t.action)}</span></div>`;}).join("") : `<h2>Lo próximo</h2><div class="empty">🎉 Todo hecho</div>`;

  let html="";
  for(const c of DATA.cats){
    const list=tasks.filter(t=>t.cat===c.id).filter(t=>matches(t,view(t))).sort(sortTasks);
    if(!list.length) continue;
    const all=tasks.filter(t=>t.cat===c.id), d=all.filter(t=>view(t).done).length;
    html += `<section class="cat"><div class="cathead"><span>${c.icon}</span><h2>${esc(c.name)}</h2><span class="count">${d}/${all.length}</span></div>${list.map(taskHTML).join("")}</section>`;
  }
  $("#list").innerHTML = html || `<div class="empty">No hay tareas con este filtro.</div>`;
  $("#foot").innerHTML = `Versión ${esc(VERSION)} · Los datos se guardan en este dispositivo · Funciona sin conexión<br>Comparte tus cambios con «Compartir» para mantener los dos móviles al día.`;
  renderBanners();
}

/* ---------- banners ---------- */
function isStandalone(){ return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone===true; }
function isIOS(){ return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1); }
function renderBanners(){
  let dismissed={}; try{ dismissed=JSON.parse(ls.get(BANNER_LS)||"{}"); }catch(e){}
  const out=[];
  const mobile = /android|iphone|ipad|ipod/i.test(navigator.userAgent) || isIOS();
  if(mobile && !isStandalone() && !dismissed.install){
    out.push(`<div class="banner"><div>📲 <b>Instálala para usarla sin conexión.</b><br>${isIOS()?"En Safari: botón Compartir ⬆️ → «Añadir a pantalla de inicio». Después ábrela siempre desde ese icono (Safari y la app guardan los datos por separado).":"En Chrome: menú ⋮ → «Instalar aplicación» o «Añadir a pantalla de inicio»."}</div><button class="x" data-dismiss="install" aria-label="Cerrar">✕</button></div>`);
  }
  if(!dismissed.sync){
    out.push(`<div class="banner"><div>🔄 Cada móvil guarda sus propios cambios. Cuando marquéis algo, pulsad <b>Compartir</b> y enviad el mensaje al otro por WhatsApp o WeChat; él lo pega en <b>Importar</b>.</div><button class="x" data-dismiss="sync" aria-label="Cerrar">✕</button></div>`);
  }
  $("#banners").innerHTML=out.join("");
}

/* ---------- modals ---------- */
function modal(html, onMount){
  const root=$("#modalroot");
  root.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div class="sheet">${html}</div></div>`;
  const m=root.firstElementChild;
  m.addEventListener("click", e=>{ if(e.target===m || e.target.closest("[data-close]")) closeModal(); });
  if(onMount) onMount(m);
  return m;
}
function closeModal(){ $("#modalroot").innerHTML=""; }

async function buildShare(){
  const payload = {v:1, from:ME||"?", at:Date.now(), items:STATE.items, custom:STATE.custom};
  const z = await deflate(new TextEncoder().encode(JSON.stringify(payload)));
  const withFlag = new Uint8Array(z.bytes.length+1); withFlag[0]=z.flag; withFlag.set(z.bytes,1);
  const code = b64ue(await encryptBytes(withFlag));
  const base = location.origin + location.pathname;
  const link = (location.protocol.startsWith("http") ? base : "") + "#s=" + code;
  const d=new Date();
  const msg = `🔄 Checklist Viaje C&J · cambios de ${ME||"?"} (${fmtTs(d.getTime())})\n${link}\n\nEn el móvil: copia este mensaje entero y pégalo en la app → Importar.`;
  return {msg, code};
}
async function shareFlow(){
  let s; try { s = await buildShare(); } catch(e){ toast("No se pudo preparar el mensaje"); return; }
  modal(`<h3>📤 Compartir mis cambios</h3>
    <p>Envía este mensaje al otro por WhatsApp o WeChat. Incluye todas tus marcas, comentarios y tareas, cifrados con la contraseña del viaje.</p>
    <textarea readonly id="sharetxt">${esc(s.msg)}</textarea>
    <div class="acts">${navigator.share?'<button class="btn primary" id="doshare">Enviar…</button>':""}<button class="btn" id="docopy">Copiar</button><button class="btn" data-close>Cerrar</button></div>`, m=>{
      const sh=m.querySelector("#doshare"); if(sh) sh.onclick=async()=>{ try{ await navigator.share({text:s.msg}); closeModal(); }catch(e){} };
      m.querySelector("#docopy").onclick=async()=>{ try{ await navigator.clipboard.writeText(s.msg); toast("Copiado"); }catch(e){ const ta=m.querySelector("#sharetxt"); ta.select(); document.execCommand("copy"); toast("Copiado"); } };
  });
}
async function importText(txt){
  let code = txt.trim(); const i = code.indexOf("#s="); if(i>=0) code = code.slice(i+3);
  code = (code.match(/^[A-Za-z0-9_-]+/)||[""])[0];
  if(code.length<20) throw new Error("vacío");
  const bytes = await decryptBytes(b64ud(code));
  const json = await inflate(bytes[0], bytes.slice(1));
  const inc = JSON.parse(new TextDecoder().decode(json));
  const n = mergeIn(inc); render();
  return {n, from:inc.from, at:inc.at};
}
function importFlow(prefill){
  modal(`<h3>📥 Importar cambios</h3>
    <p>Pega aquí el mensaje que te han enviado desde la app (o solo el enlace). Se combinan los cambios: en cada tarea gana la edición más reciente.</p>
    <textarea id="imptxt" placeholder="Pega aquí el mensaje…">${esc(prefill||"")}</textarea>
    <div class="acts"><button class="btn" id="dopaste">Pegar</button><button class="btn primary" id="doimp">Importar</button><button class="btn" data-close>Cancelar</button></div>`, m=>{
      m.querySelector("#dopaste").onclick=async()=>{ try{ m.querySelector("#imptxt").value=await navigator.clipboard.readText(); }catch(e){ toast("Pega manualmente (mantén pulsado → Pegar)"); } };
      m.querySelector("#doimp").onclick=async()=>{
        try{ const r=await importText(m.querySelector("#imptxt").value); closeModal(); toast(`✓ ${r.n} cambios importados de ${r.from}`); }
        catch(e){ toast("No se ha podido leer. ¿Es un mensaje de esta app con la misma contraseña?"); }
      };
  });
}

/* ---------- events ---------- */
let noteTimer=null;
function bind(){
  $("#filters").addEventListener("click", e=>{ const b=e.target.closest("[data-f]"); if(!b) return; filter=b.dataset.f; render(); });
  $("#cats").addEventListener("click", e=>{ const b=e.target.closest("[data-c]"); if(!b) return; catFilter=b.dataset.c; render(); });
  $("#q").addEventListener("input", e=>{ query=e.target.value.trim().toLowerCase(); render(); });
  $("#banners").addEventListener("click", e=>{ const b=e.target.closest("[data-dismiss]"); if(!b) return; let d={}; try{d=JSON.parse(ls.get(BANNER_LS)||"{}");}catch(x){} d[b.dataset.dismiss]=1; ls.set(BANNER_LS,JSON.stringify(d)); renderBanners(); });
  $("#upcoming").addEventListener("click", e=>{ const r=e.target.closest("[data-jump]"); if(!r) return; const id=r.dataset.jump; filter="all"; catFilter="all"; query=""; $("#q").value=""; openSet.add(id); render(); const el=document.querySelector(`.task[data-id="${CSS.escape(id)}"]`); if(el) el.scrollIntoView({behavior:"smooth", block:"center"}); });
  const list=$("#list");
  list.addEventListener("click", e=>{
    const el=e.target.closest("[data-act]"); if(!el) return; const art=e.target.closest(".task"); if(!art) return; const id=art.dataset.id;
    if(e.target.closest("a")) return;
    const act=el.dataset.act;
    if(act==="toggle"){ const v=view(findTask(id)); setField(id,"done",!v.done); if(!v.done) toast("✓ Completada"); render(); }
    else if(act==="open"){ if(openSet.has(id)) openSet.delete(id); else openSet.add(id); render(); }
    else if(act==="edit"){ taskForm(STATE.custom[id]); }
    else if(act==="del"){ if(confirm("¿Eliminar esta tarea?")){ STATE.custom[id]=Object.assign({},STATE.custom[id],{deleted:true,t:Date.now()}); saveState(); render(); } }
  });
  list.addEventListener("input", e=>{
    const el=e.target; if(el.dataset.act!=="notes") return; const id=el.closest(".task").dataset.id;
    clearTimeout(noteTimer); noteTimer=setTimeout(()=>{ setField(id,"notes",el.value); const ed=el.parentElement.querySelector(".edited"); if(ed) ed.textContent=`Guardado · ${ME||"?"} · ${fmtTs(Date.now())}`; },400);
  });
  list.addEventListener("change", e=>{
    const el=e.target; const act=el.dataset.act; if(act!=="target"&&act!=="limit") return; const id=el.closest(".task").dataset.id;
    setField(id, act, el.value); render();
  });
  $("#b-add").onclick=()=>taskForm(null);
  $("#b-share").onclick=shareFlow;
  $("#b-import").onclick=()=>importFlow("");
  $("#b-more").onclick=moreFlow;
  const net=()=>{ const n=$("#net"); if(navigator.onLine){ n.textContent="● En línea"; n.classList.remove("off"); } else { n.textContent="● Sin conexión · todo funciona"; n.classList.add("off"); } };
  window.addEventListener("online",net); window.addEventListener("offline",net); net();
}
function findTask(id){ return allTasks().find(t=>t.id===id); }

/* ---------- boot ---------- */
async function start(){
  DATA.cats = DATA.cats || DATA.CATS; DATA.tasks = DATA.tasks || DATA.TASKS;
  STATE = loadState(); ME = ls.get(ME_LS)||"";
  $("#lock").classList.add("hidden"); $("#app").classList.remove("hidden");
  bind(); render(); askName(false);
  window.addEventListener("hashchange", handleHash);
  await handleHash();
}
async function handleHash(){
  if(!location.hash.startsWith("#s=")) return;
  const h=location.hash; history.replaceState(null,"",location.pathname+location.search);
  try{ const r=await importText(h); toast(`✓ ${r.n} cambios importados de ${r.from}`, 3500); }catch(e){ toast("El enlace de cambios no se pudo leer"); }
}
async function unlockWith(key){ DATA = await decryptPayload(key); KEY = key; }
async function boot(){
  if(!window.crypto || !crypto.subtle){ $("#lockerr").textContent="Este navegador no permite abrir la app (necesita https)."; return; }
  const saved = ls.get(KEY_LS);
  if(saved){
    try{ const k=await crypto.subtle.importKey("raw", b64d(saved), {name:"AES-GCM"}, true, ["encrypt","decrypt"]); await unlockWith(k); return start(); }
    catch(e){ ls.del(KEY_LS); }
  }
  $("#lockform").addEventListener("submit", async e=>{
    e.preventDefault(); const p=$("#pass").value; if(!p) return; $("#lockerr").textContent="Abriendo…";
    try{
      const raw=b64d(PAYLOAD); const k=await deriveKey(p.trim(), raw.slice(0,16)); await unlockWith(k);
      const exp=await crypto.subtle.exportKey("raw",k); ls.set(KEY_LS,b64e(exp)); $("#lockerr").textContent=""; start();
    }catch(err){ $("#lockerr").textContent="Contraseña incorrecta"; }
  });
  $("#pass").focus();
}
if("serviceWorker" in navigator && (location.protocol==="https:" || location.hostname==="localhost")){
  navigator.serviceWorker.register("sw.js").then(reg=>{
    reg.addEventListener("updatefound",()=>{ const w=reg.installing; if(!w) return; w.addEventListener("statechange",()=>{ if(w.state==="installed" && navigator.serviceWorker.controller){ toast("Nueva versión disponible: cierra y vuelve a abrir la app", 5000); } }); });
  }).catch(()=>{});
}
boot();
</script>
